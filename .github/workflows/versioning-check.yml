name: Versioning checks

on:
  pull_request:
    branches: [ main, develop, '**' ]

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
n      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run ADO/STHLP version checks
        run: |
          python scripts/check_changed_ado_files.py
