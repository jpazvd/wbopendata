name: Update WB Metadata

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes'
        required: false
        type: boolean
        default: false

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-metadata.txt

      - name: Run metadata update
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        run: |
          python scripts/update_metadata.py --config config/config_update.yaml --verbose

      - name: Run unit tests
        run: pytest tests

      - name: Summarize changes
        run: |
          git status --short
          git diff --stat

      - name: Upload generated YAML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-yaml
          path: |
            src/_/_wbopendata_indicators.yaml
            src/_/_wbopendata_sources.yaml
            src/_/_wbopendata_topics.yaml
