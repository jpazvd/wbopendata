name: Sync to Public Repo (Staging)

on:
  push:
    tags: ['v*']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove private content
        run: |
          # Private folders (strategic/personal)
          rm -rf paper/
          rm -rf drafts/
          rm -rf internal/
          rm -rf benchmarks/
          rm -rf _drafts/
          rm -rf eb1a/
          
          # Testing framework private content
          rm -rf tests/logs/              # Test execution logs
          rm -rf qa/logs/                 # QA execution results
          rm -rf qa/results/              # QA execution results (if private)
          rm -rf validation/results/      # Validation results (unpublished)
          
          # Log files
          rm -f *.log
          rm -f test_*.log
          find . -name '*.log' -type f -delete
          
          # Private GitHub config
          rm -f .github/copilot-instructions.md
          rm -rf .github/copilot/
          rm -rf .github/prompts/
          
          # Hide sync workflow (contains private repo name)
          rm -f .github/workflows/sync-to-public.yml
          
          # Project tracking (internal)
          rm -f PHASE_*.md
          rm -f PROJECT_*.md
          rm -f PR14_*.md
          rm -f *_TEST_REPORT*.md
          rm -f *_VALIDATION_PROTOCOL.md
          
          # Remove any other private files
          rm -f PRIVATE_NOTES.md
          rm -f TODO-internal.md

      - name: Verify private content removed
        run: |
          echo "🔍 Verifying private content removal..."
          FOUND_PRIVATE=0
          
          PRIVATE_ITEMS=(
            "paper"
            "internal"
            "drafts"
            "benchmarks"
            "_drafts"
            "eb1a"
            ".github/copilot-instructions.md"
            ".github/copilot"
            ".github/prompts"
            ".github/workflows/sync-to-public.yml"
          )
          
          for item in "${PRIVATE_ITEMS[@]}"; do
            if [ -e "$item" ]; then
              echo "❌ FAIL: Found private item: $item"
              FOUND_PRIVATE=1
            fi
          done
          
          if find . -maxdepth 2 -name "*.log" -type f 2>/dev/null | grep -q .; then
            echo "❌ FAIL: Found .log files"
            FOUND_PRIVATE=1
          fi
          
          if [ $FOUND_PRIVATE -eq 1 ]; then
            echo "❌ Aborting sync: Private files detected!"
            exit 1
          fi
          
          echo "✅ PASS: No private files found. Safe to push."

      - name: Push to public repo (develop branch)
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        with:
          source-directory: '.'
          destination-github-username: 'jpazvd'
          destination-repository-name: 'wbopendata'
          target-branch: develop
          user-name: 'github-actions[bot]'
          user-email: 'github-actions[bot]@users.noreply.github.com'

      - name: Push tags to public repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          git remote add public-for-tags git@github.com:jpazvd/wbopendata.git 2>/dev/null || true
          git push public-for-tags --tags

