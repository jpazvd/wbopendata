/*******************************************************************************
* wbopendata QA Submission Configuration
* 
* This file enables flexible test execution in submission context.
* Auto-detected by run_tests.do when present in qa/ folder.
* 
* When submission mode is active:
*   - ENV-01, ENV-03, ENV-04 tests are skipped (they require repo structure)
*   - ENV-05 (version check) still runs to validate installed package
*   - All other 88 tests run normally
*   - YAML metadata sourced from qa/cache/ instead of installed location
*
* File Path: qa/submission.cfg (relative to submission root)
* 
* Format: Stata do-file that sets global macros
* Sourced by: run_tests.do (if present)
* Auto-detection: Checks for "qa/submission.cfg" relative to qa_dir
*******************************************************************************/

* Submission Mode Configuration
global submission_mode  = 1
global skip_repo_validation = 1

* Metadata Cache Location
* When set, tests will use local YAML files from qa/cache/
global qa_metadata_cache_override = 1

* Enable verbose submission mode output
global submission_verbose = 0

* Test Categories: Set individual skip flags (1 = skip, 0 = run)
* ENV tests: Repository structure validation (ENV-01, ENV-03, ENV-04 skipped in submission)
global skip_env_01 = 1    /* Skip: requires src/ folder in repo root */
global skip_env_03 = 1    /* Skip: requires package file structure check */
global skip_env_04 = 1    /* Skip: requires git repo validation */
global skip_env_05 = 0    /* Run: validates installed wbopendata version */

* CACHE tests: Can run with metadata in qa/cache/
global skip_cache_tests = 0

* Discovery tests: Offline tests, always run
global skip_discovery_tests = 0

* Note for reviewers:
* - Copy YAML files from source package to qa/cache/ if not present:
*   do setup_qa_environment.do
* - Or manually extract fixtures.tar.gz to qa/fixtures/
* - Then run: do run_submission_qa.do
